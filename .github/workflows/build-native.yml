name: Build IRS Spect Native

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract native source
        run: |
          mkdir -p native
          tar -xzf ci/irs-native-1.5.0.tar.gz -C native

      - name: Build unsigned release APK
        working-directory: native
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify package metadata
        run: |
          APK="native/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          echo "APK_SIZE=$(stat -c%s "$APK")"
          sha256sum "$APK"

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: IRS-Spect-Native-1.5.0-unsigned
          path: native/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
