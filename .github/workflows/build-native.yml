name: Build IRS Spect Native

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reassemble IRS Spect 1.6.0 source
        run: |
          cat ci/src.b64.00 ci/src.b64.01 ci/src.b64.02 ci/src.b64.03 ci/src.b64.04 > /tmp/base.b64
          base64 -d /tmp/base.b64 > /tmp/base.tar.gz
          gzip -t /tmp/base.tar.gz
          mkdir -p native
          tar -xzf /tmp/base.tar.gz -C native

          cat ci/160.b64.00 ci/160.b64.01 ci/160.b64.02 ci/160.b64.03a ci/160.b64.03b1 ci/160.b64.03b211 ci/160.b64.03b212a ci/160.b64.03b212b1 ci/160.b64.03b212b21 ci/160.b64.03b212b221 ci/160.b64.03b212b222 ci/160.b64.03b22 ci/160.b64.04 > /tmp/overlay.b64
          test "$(wc -c < /tmp/overlay.b64)" -eq 30860
          base64 -d /tmp/overlay.b64 > /tmp/overlay.tar.xz
          echo "5a8f05af0bfca0525c941dec65d707e5bc86a791b838f4a17b72e2fabc35721d  /tmp/overlay.tar.xz" | sha256sum -c -
          xz -t /tmp/overlay.tar.xz
          tar -xJf /tmp/overlay.tar.xz -C native

          sed -i '/android:debuggable="false"/d' native/app/src/main/AndroidManifest.xml
          sed -i 's/[[:space:]]*package="ir.dinavo.fraudwatch"//' native/app/src/main/AndroidManifest.xml

          grep -q 'versionCode = 16' native/app/build.gradle.kts
          grep -q 'versionName = "1.6.0"' native/app/build.gradle.kts
          grep -q 'APP_VERSION_CODE=16' native/app/src/main/java/ir/dinavo/fraudwatch/MainActivity.java
          grep -q 'APP_VERSION_NAME="1.6.0"' native/app/src/main/java/ir/dinavo/fraudwatch/MainActivity.java
          sed -i 's/R.drawable.irs_spect_logo/R.drawable.ic_splash/g' native/app/src/main/java/ir/dinavo/fraudwatch/MainActivity.java
          python3 - <<'PY'
          from pathlib import Path
          p=Path("native/app/src/main/java/ir/dinavo/fraudwatch/MainActivity.java")
          s=p.read_text()
          if "static int installedVersionCode(Context context)" not in s:
              needle="    private static boolean isReleaseSignatureTrusted(Context context)"
              insert='''    static int installedVersionCode(Context context){try{PackageInfo info=context.getPackageManager().getPackageInfo(context.getPackageName(),0);long code=Build.VERSION.SDK_INT>=28?info.getLongVersionCode():info.versionCode;return code>0&&code<=Integer.MAX_VALUE?(int)code:APP_VERSION_CODE;}catch(Exception e){return APP_VERSION_CODE;}}\n    static String installedVersionName(Context context){try{String n=context.getPackageManager().getPackageInfo(context.getPackageName(),0).versionName;return n==null||n.isEmpty()?APP_VERSION_NAME:n;}catch(Exception e){return APP_VERSION_NAME;}}\n'''
              if needle not in s:
                  raise SystemExit("MainActivity insertion point missing")
              s=s.replace(needle,insert+needle)
              p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("native/app/build.gradle.kts")
          s=p.read_text()
          s=re.sub(r'\n    signingConfigs \{.*?\n    \}\n\n    buildTypes', '\n    buildTypes', s, flags=re.S)
          s=s.replace('            signingConfig = signingConfigs.getByName("release")\n','')
          p.write_text(s)
          PY
          ! grep -R -n 'WebView' native/app/src/main/java/ir/dinavo/fraudwatch

      - name: Build unsigned release APK
        working-directory: native
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK output
        run: |
          APK="native/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          echo "APK_SIZE=$(stat -c%s "$APK")"
          sha256sum "$APK"

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: IRS-Spect-Native-1.6.0-unsigned
          path: native/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
