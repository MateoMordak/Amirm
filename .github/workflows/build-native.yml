name: Build IRS Spect Native

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reassemble IRS Spect 1.6.2 source
        run: |
          set -euo pipefail

          cat ci/src.b64.00 ci/src.b64.01 ci/src.b64.02 ci/src.b64.03 ci/src.b64.04 > /tmp/base.b64
          base64 -d /tmp/base.b64 > /tmp/base.tar.gz
          gzip -t /tmp/base.tar.gz
          mkdir -p native
          tar -xzf /tmp/base.tar.gz -C native

          cat ci/160.b64.00 ci/160.b64.01 ci/160.b64.02 ci/160.b64.03a ci/160.b64.03b1 ci/160.b64.03b211 ci/160.b64.03b212a ci/160.b64.03b212b1 ci/160.b64.03b212b21 ci/160.b64.03b212b221 ci/160.b64.03b212b222 ci/160.b64.03b22 ci/160.b64.04 > /tmp/overlay160.b64
          test "$(wc -c < /tmp/overlay160.b64)" -eq 30860
          base64 -d /tmp/overlay160.b64 > /tmp/overlay160.tar.xz
          echo "5a8f05af0bfca0525c941dec65d707e5bc86a791b838f4a17b72e2fabc35721d  /tmp/overlay160.tar.xz" | sha256sum -c -
          xz -t /tmp/overlay160.tar.xz
          tar -xJf /tmp/overlay160.tar.xz -C native

          sed -i '/android:debuggable="false"/d' native/app/src/main/AndroidManifest.xml
          sed -i 's/[[:space:]]*package="ir.dinavo.fraudwatch"//' native/app/src/main/AndroidManifest.xml

          python3 - <<'PY'
          from pathlib import Path
          p=Path("native/app/src/main/java/ir/dinavo/fraudwatch/MainActivity.java")
          s=p.read_text()
          if "static int installedVersionCode(Context context)" not in s:
              needle="    private static boolean isReleaseSignatureTrusted(Context context)"
              insert='    static int installedVersionCode(Context context){try{PackageInfo info=context.getPackageManager().getPackageInfo(context.getPackageName(),0);long code=Build.VERSION.SDK_INT>=28?info.getLongVersionCode():info.versionCode;return code>0&&code<=Integer.MAX_VALUE?(int)code:APP_VERSION_CODE;}catch(Exception e){return APP_VERSION_CODE;}}\\n    static String installedVersionName(Context context){try{String n=context.getPackageManager().getPackageInfo(context.getPackageName(),0).versionName;return n==null||n.isEmpty()?APP_VERSION_NAME:n;}catch(Exception e){return APP_VERSION_NAME;}}\\n'
              if needle not in s:
                  raise SystemExit("MainActivity insertion point missing")
              s=s.replace(needle,insert+needle)
              p.write_text(s)
          PY

          python3 ci/patch161.py

          cat ci/162.b64.00 ci/162.b64.01 ci/162.b64.02 ci/162.b64.03 ci/162.b64.04 ci/162.b64.05 ci/162.b64.06 ci/162.b64.07 ci/162.b64.08 ci/162.b64.09 ci/162.b64.10 ci/162.b64.11 ci/162.b64.12 ci/162.b64.13 ci/162.b64.14 > /tmp/overlay162.b64
          echo "overlay162_base64_bytes=$(wc -c < /tmp/overlay162.b64)"
          base64 -d /tmp/overlay162.b64 > /tmp/overlay162.tar.gz
          echo "23afb66fb7b40ddf494d869be923d6acba87c06808887c36290814bbd98c419f  /tmp/overlay162.tar.gz" | sha256sum -c -
          gzip -t /tmp/overlay162.tar.gz
          tar -xzf /tmp/overlay162.tar.gz -C native

          # Inject the final IRS Spect visual pack supplied for 1.6.2.
          echo "8b5dfd0491bbf2e08118d38e26bfd7e01b02fb8245592975cae77d70ba98f5c5  ci/irs-assets-1.6.2-clean.tar.gz" | sha256sum -c -
          mkdir -p native/app/src/main/assets/irs_icons native/app/src/main/res/drawable-nodpi
          tar -xzf ci/irs-assets-1.6.2-clean.tar.gz -C native/app/src/main/assets/irs_icons
          test -s native/app/src/main/assets/irs_icons/app_icon.webp
          test -s native/app/src/main/assets/irs_icons/brand_emblem.webp
          test -s native/app/src/main/assets/irs_icons/nav_home.webp
          test -s native/app/src/main/assets/irs_icons/nav_incidents.webp
          test -s native/app/src/main/assets/irs_icons/nav_search.webp
          test -s native/app/src/main/assets/irs_icons/nav_more.webp
          test -s native/app/src/main/assets/irs_icons/icon_multi.webp
          cp native/app/src/main/assets/irs_icons/app_icon.webp native/app/src/main/res/drawable-nodpi/irs_spect_launcher_new.webp
          cp native/app/src/main/assets/irs_icons/brand_emblem.webp native/app/src/main/res/drawable-nodpi/irs_spect_brand_new.webp

          python3 - <<'PY'
          from pathlib import Path
          paths = [
              Path("native/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml"),
              Path("native/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml"),
              Path("native/app/src/main/res/mipmap-anydpi/ic_launcher.xml"),
              Path("native/app/src/main/res/mipmap-anydpi/ic_launcher_round.xml"),
          ]
          for p in paths:
              if not p.exists():
                  continue
              s=p.read_text()
              import re
              s=re.sub(r'android:drawable="@drawable/[^"]+"', 'android:drawable="@drawable/irs_spect_launcher_new"', s)
              s=s.replace('@drawable/ic_launcher_foreground','@drawable/irs_spect_launcher_new')
              s=s.replace('@drawable/ic_launcher_round','@drawable/irs_spect_launcher_new')
              s=s.replace('@drawable/ic_launcher','@drawable/irs_spect_launcher_new')
              p.write_text(s)
          for name in ("values-v31/styles.xml","values-v35/styles.xml"):
              p=Path("native/app/src/main/res")/name
              if p.exists():
                  s=p.read_text().replace('@drawable/ic_splash','@drawable/irs_spect_brand_new')
                  p.write_text(s)
          PY

          # Rank chooser: only the three access choices, no owner/name label.
          python3 - <<'PY'
          from pathlib import Path
          p=Path("native/app/src/main/java/ir/dinavo/fraudwatch/MainActivity.java")
          s=p.read_text()
          s=s.replace('TextView who=UiKit.text(this,name,12,UiKit.MUTED);who.setGravity(Gravity.RIGHT);box.addView(who);','')
          p.write_text(s)
          PY

          # Keep the established large raster resources in CI; the final user-supplied
          # identity assets are injected locally before production signing.
          curl --fail --location --retry 4 --retry-delay 2             --user-agent "IRS-Spect-CI/1.6.2"             "https://dinavo.ir/wp-content/plugins/dinavo-game-audit/assets/android/IRS-Spect-1.3.5.apk"             -o /tmp/irs-original.apk
          unzip -t /tmp/irs-original.apk >/dev/null
          mkdir -p native/app/src/main/res/drawable-nodpi
          unzip -p /tmp/irs-original.apk res/drawable-nodpi-v4/irs_spect_logo.png > native/app/src/main/res/drawable-nodpi/irs_spect_logo.png
          unzip -p /tmp/irs-original.apk res/drawable-nodpi-v4/irs_spect_launcher.png > native/app/src/main/res/drawable-nodpi/irs_spect_launcher.png
          test "$(stat -c%s native/app/src/main/res/drawable-nodpi/irs_spect_logo.png)" -gt 200000
          test "$(stat -c%s native/app/src/main/res/drawable-nodpi/irs_spect_launcher.png)" -gt 150000

          # CI makes an unsigned artifact. The private signing key never goes to GitHub.
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("native/app/build.gradle.kts")
          s=p.read_text()
          s=re.sub(r'\n    signingConfigs \{.*?\n    \}\n\n    buildTypes', '\n    buildTypes', s, flags=re.S)
          s=s.replace('            signingConfig = signingConfigs.getByName("release")\n','')
          p.write_text(s)
          PY

          grep -q 'versionCode = 18' native/app/build.gradle.kts
          grep -q 'versionName = "1.6.2"' native/app/build.gradle.kts
          grep -q 'APP_VERSION_CODE=18' native/app/src/main/java/ir/dinavo/fraudwatch/MainActivity.java
          grep -q 'APP_VERSION_NAME="1.6.2"' native/app/src/main/java/ir/dinavo/fraudwatch/MainActivity.java
          grep -q '"version_code":18' native/app/src/main/assets/irs_spect_release.json
          grep -q 'syncRiskSwitches' native/app/src/main/java/ir/dinavo/fraudwatch/MainActivity.java
          grep -q 'multipartProfileMedia' native/app/src/main/java/ir/dinavo/fraudwatch/NativeApi.java
          grep -q 'dedupeDevices' native/app/src/main/java/ir/dinavo/fraudwatch/MainActivity.java
          grep -q 'showRankDialog' native/app/src/main/java/ir/dinavo/fraudwatch/MainActivity.java
          ! grep -q 'TextView who=UiKit.text(this,name' native/app/src/main/java/ir/dinavo/fraudwatch/MainActivity.java
          ! grep -R -n 'WebView' native/app/src/main/java/ir/dinavo/fraudwatch

      - name: Build unsigned 1.6.2 release
        working-directory: native
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify compiled APK
        run: |
          set -euo pipefail
          APK="native/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          SIZE="$(stat -c%s "$APK")"
          echo "APK_SIZE=$SIZE"
          test "$SIZE" -ge 500000
          unzip -t "$APK" >/dev/null
          unzip -p "$APK" assets/irs_spect_release.json | grep -q '"version_code":18'
          unzip -l "$APK" > /tmp/apk-list.txt
          grep -q 'assets/irs_icons/app_icon.webp' /tmp/apk-list.txt
          grep -q 'assets/irs_icons/nav_incidents.webp' /tmp/apk-list.txt
          grep -q 'assets/irs_icons/icon_multi.webp' /tmp/apk-list.txt
          sha256sum "$APK"

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: IRS-Spect-Native-1.6.2-Build-18-unsigned
          path: native/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
