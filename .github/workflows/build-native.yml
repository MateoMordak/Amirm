name: Build IRS Spect Native

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reassemble native source
        run: |
          cat ci/src.b64.00 ci/src.b64.01 ci/src.b64.02 ci/src.b64.03 ci/src.b64.04 > /tmp/irs-native.b64
          base64 -d /tmp/irs-native.b64 > /tmp/irs-native.tar.gz
          gzip -t /tmp/irs-native.tar.gz
          mkdir -p native
          tar -xzf /tmp/irs-native.tar.gz -C native
          sed -i '/android:debuggable="false"/d' native/app/src/main/AndroidManifest.xml
          sed -i 's/[[:space:]]*package="ir.dinavo.fraudwatch"//' native/app/src/main/AndroidManifest.xml

      - name: Build unsigned release APK
        working-directory: native
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK output
        run: |
          APK="native/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          echo "APK_SIZE=$(stat -c%s "$APK")"
          sha256sum "$APK"

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: IRS-Spect-Native-1.5.0-unsigned
          path: native/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
